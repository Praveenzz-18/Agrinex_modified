services:
  - type: web
    name: agrinex-backend
    env: python
    region: singapore
    rootDir: Agrinex-main/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
